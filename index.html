<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lista de compras</title>
<style>
:root{--verde:#1b8a3a;--amarelo:#ffc928;--vermelho:#d62828;--branco:#fff}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,sans-serif;background:#f4faf5;color:#1d2b21}
main{max-width:460px;margin:2rem auto;background:var(--branco);border-radius:14px;overflow:hidden;box-shadow:0 6px 24px #0002}
header{background:var(--verde);color:var(--branco);padding:1rem 1.2rem;border-bottom:6px solid var(--amarelo)}
h1{margin:0;font-size:1.3rem}
section{padding:1rem 1.2rem}
form{display:grid;grid-template-columns:auto 1fr auto;gap:.5rem;align-items:center}
input[type=text]{padding:.55rem;border:2px solid var(--verde);border-radius:8px;font-size:1rem}
button{border:0;border-radius:8px;padding:.55rem .9rem;font-weight:700;cursor:pointer}
form button{background:var(--amarelo);color:#1d2b21}
#erro{margin-top:.6rem;padding:.5rem .7rem;background:#fdeaea;color:var(--vermelho);border-left:4px solid var(--vermelho);border-radius:6px}
ul{list-style:none;margin:1rem 0 0;padding:0}
li{display:flex;gap:.6rem;align-items:center;padding:.6rem .2rem;border-bottom:1px solid #e3ece5}
li span{flex:1}li.feito span{text-decoration:line-through;color:#7a8a7f}
li input{accent-color:var(--verde);width:1.15rem;height:1.15rem}
li button{background:var(--branco);color:var(--vermelho);border:2px solid var(--vermelho);padding:.25rem .6rem}
li button:hover{background:var(--vermelho);color:var(--branco)}
#vazio{color:#7a8a7f;text-align:center}
footer{display:flex;justify-content:space-between;align-items:center;gap:.5rem;padding:.8rem 1.2rem;background:#f4faf5}
#resumo{margin:0;font-weight:700;color:var(--verde)}
#limpar{background:var(--vermelho);color:var(--branco)}
#barra{height:8px;background:#e3ece5}#barra div{height:100%;width:0;background:var(--verde);transition:width .3s}
</style>
</head>
<body>
<main>
  <header><h1>🛒 Lista de compras</h1></header>
  <section>
    <form id="form">
      <label for="novo">Novo item</label>
      <input id="novo" type="text" autocomplete="off" placeholder="Ex.: Café">
      <button type="submit">Adicionar</button>
    </form>
    <div id="erro" role="alert" hidden></div>
    <ul id="lista"></ul>
    <p id="vazio" hidden>Nenhum item na lista.</p>
  </section>
  <div id="barra"><div id="progresso"></div></div>
  <footer>
    <p id="resumo"></p>
    <button id="limpar" type="button">Limpar concluídos</button>
  </footer>
</main>
<script>
const KEY = 'lista-de-compras', $ = (id) => document.getElementById(id);
let itens = [];
try { itens = JSON.parse(localStorage.getItem(KEY)) || []; } catch (e) {}
const salvar = () => { localStorage.setItem(KEY, JSON.stringify(itens)); render(); };

function render() {
  $('lista').replaceChildren(...itens.map((it, i) => {
    const li = document.createElement('li');
    li.className = it.feito ? 'feito' : '';
    li.innerHTML = '<input type="checkbox"><span></span><button type="button">Remover</button>';
    const [cb, span, bt] = li.children;
    cb.checked = it.feito;
    cb.setAttribute('aria-label', 'Concluir ' + it.nome);
    cb.onchange = () => { it.feito = cb.checked; salvar(); };
    span.textContent = it.nome;
    bt.setAttribute('aria-label', 'Remover ' + it.nome);
    bt.onclick = () => { itens.splice(i, 1); salvar(); };
    return li;
  }));
  const n = itens.length, c = itens.filter((x) => x.feito).length;
  $('vazio').hidden = n > 0;
  $('limpar').hidden = c === 0;
  $('progresso').style.width = (n ? (c / n) * 100 : 0) + '%';
  $('resumo').textContent = `${n} ${n === 1 ? 'item' : 'itens'} · ${c} ${c === 1 ? 'concluído' : 'concluídos'}`;
}

$('form').onsubmit = (e) => {
  e.preventDefault();
  const nome = $('novo').value.trim();
  $('erro').hidden = !!nome;
  if (!nome) { $('erro').textContent = 'Digite um item antes de adicionar.'; return; }
  itens.push({ nome, feito: false });
  $('novo').value = '';
  salvar();
};
$('limpar').onclick = () => { itens = itens.filter((x) => !x.feito); salvar(); };
render();
</script>
</body>
</html>
